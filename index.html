<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">
    <!-- gets rid of favicon error -->
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <div class="board-container">
            <div class="board">
                <div class="board-cell top left"></div>
                <div class="board-cell top"></div>
                <div class="board-cell top right"></div>
                <div class="board-cell left"></div>
                <div class="board-cell"></div>
                <div class="board-cell right"></div>
                <div class="board-cell bottom left"></div>
                <div class="board-cell bottom"></div>
                <div class="board-cell bottom right"></div>
            </div>
        </div>
        <div class="score-display">
            <p id="player1-score"></p>
            <p id="tie-score"></p>
            <p id="player2-score"></p>
        </div>
    </main>
</body>
</html>
